<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <style>
      .pixel { fill: #0F172A; }
      .bg { fill: #FFFFFF; }
      .accent { fill: #E11D48; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="300" height="300" rx="20" class="bg" />

  <!-- Top-Left Target -->
  <rect x="25" y="25" width="70" height="70" rx="8" class="pixel" />
  <rect x="37" y="37" width="46" height="46" rx="4" class="bg" />
  <rect x="47" y="47" width="26" height="26" rx="3" class="pixel" />

  <!-- Top-Right Target -->
  <rect x="205" y="25" width="70" height="70" rx="8" class="pixel" />
  <rect x="217" y="37" width="46" height="46" rx="4" class="bg" />
  <rect x="227" y="47" width="26" height="26" rx="3" class="pixel" />

  <!-- Bottom-Left Target -->
  <rect x="25" y="205" width="70" height="70" rx="8" class="pixel" />
  <rect x="37" y="217" width="46" height="46" rx="4" class="bg" />
  <rect x="47" y="227" width="26" height="26" rx="3" class="pixel" />

  <!-- Decorative QR Data Dots -->
  <g class="pixel">
    <!-- Row 1 -->
    <rect x="115" y="30" width="16" height="16" rx="3" />
    <rect x="145" y="30" width="16" height="16" rx="3" />
    <rect x="175" y="30" width="16" height="16" rx="3" />
    <!-- Row 2 -->
    <rect x="115" y="60" width="30" height="16" rx="3" />
    <rect x="160" y="60" width="16" height="30" rx="3" />
    <!-- Row 3 -->
    <rect x="30" y="115" width="16" height="16" rx="3" />
    <rect x="60" y="115" width="30" height="16" rx="3" />
    <rect x="115" y="105" width="16" height="40" rx="3" />
    <rect x="145" y="115" width="25" height="16" rx="3" />
    <rect x="205" y="115" width="16" height="30" rx="3" />
    <rect x="240" y="115" width="30" height="16" rx="3" />
    <!-- Row 4 -->
    <rect x="30" y="145" width="30" height="30" rx="3" />
    <rect x="75" y="145" width="16" height="16" rx="3" />
    <rect x="235" y="145" width="35" height="16" rx="3" />
    <rect x="250" y="175" width="20" height="20" rx="3" />
    <!-- Row 5 (Bottom) -->
    <rect x="115" y="175" width="25" height="16" rx="3" />
    <rect x="160" y="165" width="16" height="30" rx="3" />
    <rect x="115" y="210" width="16" height="60" rx="3" />
    <rect x="145" y="210" width="40" height="16" rx="3" />
    <rect x="145" y="240" width="25" height="30" rx="3" />
    <rect x="205" y="210" width="25" height="16" rx="3" />
    <rect x="245" y="210" width="25" height="35" rx="3" />
    <rect x="195" y="245" width="35" height="25" rx="3" />
  </g>

  <!-- Center Badge (Coffee / Donate Icon) -->
  <rect x="120" y="120" width="60" height="60" rx="14" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="3" />
  <g transform="translate(134, 134)">
    <!-- Heart / Coffee icon -->
    <path d="M16 29s-13-8.2-13-17.5C3 5.4 8 2 12.5 5 15 6.7 16 8.5 16 8.5s1-1.8 3.5-3.5c4.5-3 9.5.4 9.5 6.5C29 20.8 16 29 16 29z" class="accent" />
  </g>
</svg>
